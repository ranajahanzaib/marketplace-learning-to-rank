name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory apps/api --extra test
      - run: uv run --directory apps/api ruff check src tests
      - run: uv run --directory apps/api mypy src/marketplace_learning_to_rank/core/models.py src/marketplace_learning_to_rank/ranking/features.py
      - run: uv run --directory apps/api pytest
      - run: uv run --directory apps/api marketplace_learning_to_rank data generate --seed 7 --provider-count 80 --query-count 80
      - run: uv run --directory apps/api marketplace_learning_to_rank train --smoke-encoder
      - run: uv run --directory apps/api python -m marketplace_learning_to_rank.ci_smoke
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --dir apps/web --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web build
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory apps/api --extra test
      - run: uv run --directory apps/api marketplace_learning_to_rank data generate --seed 11 --provider-count 80 --query-count 80
      - run: uv run --directory apps/api marketplace_learning_to_rank train --smoke-encoder
      - run: uv run --directory apps/api marketplace_learning_to_rank evaluate --smoke-encoder
      - run: uv run --directory apps/api marketplace_learning_to_rank benchmark --iterations 100 --smoke-encoder
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --dir apps/web --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm --dir apps/web test:e2e
        env:
          CI: true
